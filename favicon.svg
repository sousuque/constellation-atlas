<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1026" />
      <stop offset="50%" stop-color="#121b40" />
      <stop offset="100%" stop-color="#050714" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradient for Constellation Lines -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Gradient for Major Stars -->
    <radialGradient id="majorStarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Icon Base / Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Background Decorative Stars (Small Ambient Dots) -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="80" cy="100" r="1.5" />
    <circle cx="420" cy="80" r="2" opacity="0.7" />
    <circle cx="430" cy="380" r="1" />
    <circle cx="90" cy="410" r="2" />
    <circle cx="230" cy="70" r="1" />
    <circle cx="110" cy="250" r="1.5" />
    <circle cx="400" cy="220" r="1.5" />
  </g>

  <!-- Big Dipper / Ursa Major Lines -->
  <g stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle -->
    <line x1="100" y1="200" x2="150" y2="170" />
    <line x1="150" y1="170" x2="210" y2="185" />
    <line x1="210" y1="185" x2="260" y2="230" />
    
    <!-- Bowl -->
    <line x1="260" y1="230" x2="350" y2="200" />
    <line x1="350" y1="200" x2="390" y2="280" />
    <line x1="390" y1="280" x2="290" y2="320" />
    <line x1="290" y1="320" x2="260" y2="230" />
  </g>

  <!-- Major Star Glow Overlay -->
  <g filter="url(#glow)">
    <!-- Alkaid -->
    <circle cx="100" cy="200" r="8" fill="url(#majorStarGrad)" />
    <circle cx="100" cy="200" r="3" fill="#ffffff" />

    <!-- Mizar -->
    <circle cx="150" cy="170" r="8" fill="url(#majorStarGrad)" />
    <circle cx="150" cy="170" r="3" fill="#ffffff" />

    <!-- Alioth -->
    <circle cx="210" cy="185" r="8" fill="url(#majorStarGrad)" />
    <circle cx="210" cy="185" r="3" fill="#ffffff" />

    <!-- Megrez -->
    <circle cx="260" cy="230" r="8" fill="url(#majorStarGrad)" />
    <circle cx="260" cy="230" r="3" fill="#ffffff" />

    <!-- Dubhe -->
    <circle cx="350" cy="200" r="10" fill="url(#majorStarGrad)" />
    <circle cx="350" cy="200" r="4" fill="#ffffff" />

    <!-- Merak -->
    <circle cx="390" cy="280" r="9" fill="url(#majorStarGrad)" />
    <circle cx="390" cy="280" r="3.5" fill="#ffffff" />

    <!-- Phecda -->
    <circle cx="290" cy="320" r="8" fill="url(#majorStarGrad)" />
    <circle cx="290" cy="320" r="3" fill="#ffffff" />
  </g>

  <!-- Sparkling Hero Star (North Star / Polaris effect in top right) -->
  <g transform="translate(340, 110)" filter="url(#glow)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="20" fill="url(#majorStarGrad)" opacity="0.8" />
    <!-- 4-Point Star Flare -->
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="#ffffff" />
    <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#e0f2fe" opacity="0.9" />
  </g>

  <!-- Subtle Arc / Sky Compass Element -->
  <path d="M 70 380 A 240 240 0 0 1 440 380" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
</svg>
